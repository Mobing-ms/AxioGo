[project]
name = "axiogo"
version = "0.1.0"
description = "AxioGo backend - FastAPI + LangGraph AXIS multi-agent API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.1",
    "email-validator>=2.2.0",
    "supabase>=2.31.0",
    "databricks-sql-connector>=4.4.0",
    "pandas>=3.0.5",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
